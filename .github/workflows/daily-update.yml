name: SponsorPulse Daily Update

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests beautifulsoup4 pandas

      - name: Collect new announcements
        run: python daily_scraper.py --csv deals.csv

      - name: Save updated data
        run: |
          if ! git diff --quiet -- deals.csv; then
            git config user.name "SponsorPulse Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add deals.csv
            git commit -m "Daily SponsorPulse data update"
            git push
          else
            echo "No new announcements."
          fi
